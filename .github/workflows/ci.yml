name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Tool versions are pinned; update them deliberately (REQ-008).
env:
  SEMGREP_VERSION: "1.180.0"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb" # linux_x64
  HUGO_VERSION: "0.167.0" # extended build (image processing: WebP)
  HUGO_SHA256: "0163f5c3deddac1f494a1629ddc40c65d18de9d5794facd98f7f96ac2c7d8957" # hugo_extended linux-amd64.tar.gz
  TAILWIND_VERSION: "4.3.3" # standalone CLI, builds the theme stylesheet
  TAILWIND_SHA256: "dc61b3ac6b8c9ca874c0cc4c57b2409791a64c5540404ca5f5367360babc313a" # tailwindcss-linux-x64

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false # later steps run project code; keep the job token out of .git/config
      - name: Install analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          pipx install "semgrep==$SEMGREP_VERSION"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" gitleaks && sudo install gitleaks /usr/local/bin/gitleaks
      - name: Install Hugo and the Tailwind CSS CLI (pinned, checksum verified)
        run: |
          hugo_archive="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -fsSLO "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${hugo_archive}"
          echo "${HUGO_SHA256}  ${hugo_archive}" | sha256sum -c -
          tar -xzf "$hugo_archive" hugo && sudo install hugo /usr/local/bin/hugo
          curl -fsSLo tailwindcss "https://github.com/tailwindlabs/tailwindcss/releases/download/v${TAILWIND_VERSION}/tailwindcss-linux-x64"
          echo "${TAILWIND_SHA256}  tailwindcss" | sha256sum -c -
          sudo install tailwindcss /usr/local/bin/tailwindcss
      - name: Test the docs version bump
        run: tests/bump-docs-version.sh
      - name: Render the docs of the pinned Xaden release
        env:
          GITHUB_TOKEN: ${{ github.token }} # read-only (contents: read); lifts the API rate limit for the release date
        run: scripts/sync-docs.sh
      - name: Build the site and check it
        run: scripts/check-site.sh
      - name: Static analysis (full run, missing tools fail)
        run: scripts/check.sh --strict
      # The registry rules are not pinned on purpose: new rules catch new vulnerability patterns,
      # so a finding can appear without a code change (docs/security.md, Static analysis).
      - name: SAST with semgrep registry rules (broader, needs network)
        run: semgrep scan --config p/default --metrics=off --error --quiet
      - name: Commit messages (contributors may not have local hooks)
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: scripts/verify-commits.sh --ci
      # REQ-007: the site that was just checked is the one that goes live. It is built from this exact
      # commit, only on a push to main, and only the deploy job below publishes it.
      - name: Build the site for publishing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: hugo --gc --minify --destination public
      - name: Upload the site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public
          include-hidden-files: true # the action skips dot folders by default, which drops /.well-known/security.txt

  deploy:
    name: deploy
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Only this job may write to Pages, and only with a short-lived token for that.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Check that security.txt is served (REQ-009)
        run: |
          curl -fsS --retry 6 --retry-delay 10 --retry-all-errors https://xaden.dev/.well-known/security.txt | grep -q '^Contact:'
