name: bump-docs

# Opens a pull request that moves XADEN_DOCS_VERSION to the newest Xaden release (REQ-006).
# The pull request runs the normal CI, which renders and checks the new docs; a person merges it.
# It needs the repository secret DOCS_BUMP_TOKEN (fine-grained token, this repository only:
# Contents and Pull requests read/write): pull requests opened with the built-in token do not
# trigger CI, so the required checks would never run.
on:
  schedule:
    - cron: "17 5 * * *" # daily; a release is proposed to the site within 24 hours
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # the token is handed to git by gh below, not stored in .git/config
      - name: Bump the pinned version and open a pull request
        env:
          GH_TOKEN: ${{ secrets.DOCS_BUMP_TOKEN }}
        run: |
          tag="$(scripts/bump-docs-version.sh)"
          [ -n "$tag" ] || { echo "XADEN_DOCS_VERSION is current"; exit 0; }
          branch="chore/docs-$tag"
          git config user.name "xaden-docs-bump"
          git config user.email "xaden-docs-bump@users.noreply.github.com"
          gh auth setup-git
          git switch -c "$branch"
          git commit -am "chore(docs): render the docs of Xaden $tag" -m "Refs: REQ-006"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "chore(docs): render the docs of Xaden $tag" \
            --body "Automatic bump of XADEN_DOCS_VERSION to $tag (REQ-006). CI renders the docs of that tag and checks the site. Merge when green."
