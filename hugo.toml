baseURL = "https://xaden.dev/"
title = "Xaden"
locale = "en"
theme = "xaden"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term", "rss"]

[markup.goldmark.renderer]
  unsafe = false

# Chroma classes instead of inline styles: the Content-Security-Policy forbids inline styles.
[markup.highlight]
  noClasses = false
  guessSyntax = false

[params]
  description = "Xaden is an open source starter that keeps AI coding assistants within rules, checks and requirements."

[pagination]
  disableAliases = true


# Table of contents of the role pages: sections (h2) and their subsections (h3).
[markup.tableOfContents]
  startLevel = 2
  endLevel = 3

[[menus.main]]
  identifier = "docs"
  name = "Docs"
  pageRef = "/docs"
  weight = 1
[[menus.main]]
  name = "Quick start"
  pageRef = "/docs/quick-start"
  parent = "docs"
  weight = 1
[[menus.main]]
  name = "Admins"
  pageRef = "/docs/admins"
  parent = "docs"
  weight = 2
[[menus.main]]
  name = "Developers"
  pageRef = "/docs/developers"
  parent = "docs"
  weight = 3
[[menus.main]]
  name = "Security"
  pageRef = "/docs/security"
  parent = "docs"
  weight = 4
[[menus.main]]
  name = "About"
  pageRef = "/about"
  weight = 2
