{{/* REQ-012: GitHub Pages cannot send response headers, so the policy is a meta tag.
     Not expressible in a meta tag: frame-ancestors, report-uri, sandbox (see docs/threat-model.md). */}}
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; font-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'">
