# The assistants of the picker (REQ-022). `id` is what the URL hash, localStorage and the
# markup use; `shows` is the command form (slash = "/name", skill = "$name", prompt = "xaden prompt name");
# `needs` is the --assistants value that writes the command files (empty: nothing to add).
- id: claude
  name: Claude Code
  shows: slash
  needs: ""
- id: codex
  name: Codex CLI
  shows: skill
  needs: codex
- id: copilot
  name: GitHub Copilot
  shows: slash
  needs: copilot
- id: vibe
  name: Mistral Vibe
  shows: slash
  needs: vibe
- id: other
  name: Other assistant
  shows: prompt
  needs: ""
